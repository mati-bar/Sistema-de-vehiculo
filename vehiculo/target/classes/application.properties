spring.application.name=vehiculo
# Base en memoria: DB_CLOSE_DELAY=-1 evita que se borre entre conexiones
spring.datasource.url=jdbc:h2:mem:vehiculos;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web para inspeccionar la base mientras la app corre
# Una vez levantado: http://localhost:8080/h2-console
# JDBC URL a pegar ahi: jdbc:h2:mem:vehiculos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Le decimos a Hibernate que NO administre el esquema (lo hace schema.sql)
spring.jpa.hibernate.ddl-auto=none
# Ejecuta siempre schema.sql y data.sql al arrancar
spring.sql.init.mode=always
# Espera a que JPA este listo antes de correr schema.sql/data.sql, para que no choquen
spring.jpa.defer-datasource-initialization=true
# Util para ver el SQL que genera Hibernate en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true